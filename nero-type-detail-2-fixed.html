<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NERO — تعرّف على شخصيتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes revealIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
:root{
  --black:#0B0B0B;
  --surface:#161414;
  --card:#1a1717;
  --border:#2A2A2A;
  --muted:#3a3535;
  --dim:#7a7270;
  --mid:#a8a09c;
  --light:#e8e3dc;
  --white:#F5F2EB;
  --accent:#C8A24A;
  --accent-rgb:200,162,74;
  --accent-dim:rgba(200,162,74,0.08);
  --accent-glow:rgba(200,162,74,0.22);
}
/* ═══ باليتات ألوان بديلة — نفس الباليتات ديال nero-test و nero-landing،
   باش الألوان تبقى موحدة عبر الصفحات الثلاثة (كتنحفظ فـ localStorage) ═══ */
body.theme-kiwi {
  --black:#222222; --surface:#2b2b2b; --card:#303030; --border:#3c3c3c;
  --muted:#454545; --dim:#8a8a8a; --mid:#b5b5b5; --light:#e8e3dc; --white:#F5F2EB;
  --accent:#89E900; --accent-rgb:137,233,0; --accent-dim:rgba(137,233,0,0.08); --accent-glow:rgba(137,233,0,0.22);
}
body.theme-purple {
  --black:#141414; --surface:#1c1a1f; --card:#211f26; --border:#2c2933;
  --muted:#3a3542; --dim:#7a7280; --mid:#a89fb0; --light:#e2dce8; --white:#F1EDF5;
  --accent:#7F49B4; --accent-rgb:127,73,180; --accent-dim:rgba(127,73,180,0.1); --accent-glow:rgba(127,73,180,0.25);
}
body.theme-burgundy {
  --black:#1C1C1C; --surface:#241717; --card:#2a1a1a; --border:#3a2222;
  --muted:#4a2a2a; --dim:#8a7070; --mid:#b09a9a; --light:#ecdcdc; --white:#F5EDED;
  --accent:#800020; --accent-rgb:128,0,32; --accent-dim:rgba(128,0,32,0.1); --accent-glow:rgba(128,0,32,0.25);
}
body.theme-luxury {
  --black:#121312; --surface:#1a1614; --card:#1f1a17; --border:#2e2620;
  --muted:#3d332a; --dim:#8a7a68; --mid:#b8a690; --light:#ecdcc0; --white:#F5EDDD;
  --accent:#ad0013; --accent-rgb:173,0,19; --accent-dim:rgba(173,0,19,0.1); --accent-glow:rgba(173,0,19,0.25);
}
.theme-toggle{background:transparent;border:1px solid var(--border);color:var(--white);width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;margin-inline-start:.4rem;padding:0;}
.theme-toggle:hover{border-color:var(--accent);}
.theme-toggle .swatch{width:14px;height:14px;border-radius:50%;background:var(--accent);display:block;transition:background .2s;}
body{background:var(--black);color:var(--white);font-family:'Cairo',sans-serif;overflow-x:hidden;min-height:100vh;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:.7rem 2rem;background:rgba(11,11,11,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Space Mono',monospace;font-size:1rem;font-weight:700;color:var(--accent);letter-spacing:.2em;text-decoration:none;}
.lang-switcher{display:flex;gap:.3rem;}
.lang-btn{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.12em;padding:.22rem .5rem;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--dim);cursor:pointer;transition:all .2s;}
.lang-btn.active,.lang-btn:hover{border-color:var(--accent);color:var(--accent);}

main{max-width:760px;margin:0 auto;padding:7rem 5vw 5rem;position:relative;z-index:1;}

.back-link{display:inline-flex;align-items:center;gap:.4rem;font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.08em;color:var(--dim);text-decoration:none;margin-bottom:2rem;transition:color .2s;}
.back-link:hover{color:var(--accent);}

/* TYPE SWITCHER STRIP */
.type-strip{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.8rem;margin-bottom:2.5rem;scrollbar-width:thin;}
.type-strip::-webkit-scrollbar{height:4px;}
.type-strip::-webkit-scrollbar-thumb{background:var(--muted);border-radius:4px;}
.type-pill{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.06em;padding:.4rem .7rem;border:1px solid var(--border);border-radius:20px;color:var(--dim);cursor:pointer;background:var(--surface);transition:all .2s;}
.type-pill:hover{border-color:rgba(var(--accent-rgb),.4);color:var(--light);}
.type-pill.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

/* HERO */
.type-hero{text-align:center;padding:2rem 0 2.5rem;border-bottom:1px solid var(--border);margin-bottom:2.5rem;}
.type-hero-badge{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.3em;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(var(--accent-rgb),.2);padding:.3rem 1rem;border-radius:20px;display:inline-block;margin-bottom:1.5rem;}
.type-hero-portrait{width:148px;height:148px;object-fit:cover;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 28px var(--accent-glow);display:block;margin:0 auto 1rem;-webkit-mask-image:radial-gradient(circle, #000 72%, transparent 100%);mask-image:radial-gradient(circle, #000 72%, transparent 100%);}
.gender-toggle{display:flex;justify-content:center;gap:.4rem;margin-bottom:1.2rem;}
.gender-toggle-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--dim);font-size:1rem;cursor:pointer;transition:all .2s;}
.gender-toggle-btn:hover{border-color:rgba(var(--accent-rgb),.5);color:var(--light);}
.gender-toggle-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.type-hero-code{font-family:'Cormorant Garamond',serif;font-size:clamp(4rem,15vw,7rem);font-weight:300;color:var(--accent);line-height:1;margin-bottom:.3rem;letter-spacing:.05em;}
.type-hero-name{font-size:1.1rem;font-weight:700;color:var(--white);margin-bottom:.4rem;}
.type-hero-stack{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.15em;color:var(--dim);margin-bottom:1.5rem;}
.type-hero-desc{font-size:.9rem;line-height:1.9;color:var(--mid);font-weight:300;max-width:520px;margin:0 auto;text-align:start;}

/* STRENGTH / CHALLENGE GRID */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-bottom:2.5rem;}
@media (max-width:640px){.two-col{grid-template-columns:1fr;}}
.info-box{border:1px solid var(--border);border-radius:18px;padding:1.8rem 1.6rem;background:var(--card);box-shadow:0 12px 35px rgba(0,0,0,.28);transition:transform 300ms cubic-bezier(.22,1,.36,1), box-shadow 300ms cubic-bezier(.22,1,.36,1);}
.info-box:hover{transform:translateY(-4px);box-shadow:0 18px 45px rgba(0,0,0,.35);}
.info-box-title{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1rem;}
.info-box.strengths .info-box-title{color:var(--accent);}
.info-box.challenges .info-box-title{color:var(--dim);}
.info-box ul{list-style:none;display:flex;flex-direction:column;gap:.6rem;}
.info-box li{font-size:.82rem;color:var(--light);font-weight:300;line-height:1.5;padding-inline-start:1.1rem;position:relative;}
.info-box.strengths li::before{content:'✦';position:absolute;inset-inline-start:0;color:var(--accent);font-size:.65rem;top:.1rem;}
.info-box.challenges li::before{content:'—';position:absolute;inset-inline-start:0;color:var(--dim);}

/* ENNEAGRAM SECTION */
.enn-section-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;margin-bottom:.4rem;}
.enn-section-title em{color:var(--accent);font-style:italic;}
.enn-note{font-size:.78rem;color:var(--dim);line-height:1.7;font-weight:300;margin-bottom:1.5rem;max-width:560px;}
.enn-card{border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:1.4rem 1.5rem;margin-bottom:1rem;display:flex;gap:1rem;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform 300ms cubic-bezier(.22,1,.36,1), box-shadow 300ms cubic-bezier(.22,1,.36,1), border-color 300ms;}

.famous-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;margin-top:1rem;}
.famous-card{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:1.1rem .8rem;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:transform 300ms ease, border-color 300ms ease;}
.famous-card:hover{transform:translateY(-4px);border-color:rgba(var(--accent-rgb),.4);}
.famous-name{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--white);margin-bottom:.2rem;}
.famous-role{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.06em;color:var(--dim);}
@media(max-width:520px){.famous-grid{grid-template-columns:repeat(2,1fr);}}
.enn-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.3);border-color:rgba(var(--accent-rgb),.3);}
.enn-card.top-match{border-color:rgba(var(--accent-rgb),.4);background:var(--accent-dim);}
.enn-card.rare-match{opacity:.6;}
.enn-card-tag.rare{color:var(--dim);border-color:var(--border);}
.enn-card-code{font-family:'Space Mono',monospace;font-size:1.15rem;font-weight:700;color:var(--accent);flex:0 0 auto;min-width:52px;}
.enn-card-body{flex:1;}
.enn-card-name{font-size:.85rem;font-weight:600;color:var(--light);margin-bottom:.35rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.enn-card-tag{font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:.08em;color:var(--accent);border:1px solid rgba(var(--accent-rgb),.4);border-radius:20px;padding:.12rem .5rem;}
.enn-card-desc{font-size:.78rem;color:var(--mid);line-height:1.6;font-weight:300;}
.enn-wings{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;}
.wing-chip{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.04em;padding:.32rem .65rem;border:1px solid var(--border);border-radius:20px;color:var(--light);background:var(--card);display:inline-flex;align-items:center;gap:.4rem;}
.wing-chip b{color:var(--accent);font-weight:700;}

/* CTA */
.cta-box{text-align:center;padding:3rem 1.5rem;border:1px solid rgba(var(--accent-rgb),.3);border-radius:20px;background:var(--accent-dim);margin-top:3.5rem;box-shadow:0 12px 35px rgba(0,0,0,.3);}
.cta-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;margin-bottom:1.2rem;}
.btn-primary{background:var(--accent);color:var(--black);border:none;border-radius:10px;padding:.85rem 2rem;font-family:'Cairo',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none;display:inline-block;transition:all .25s;}
.btn-primary:hover{box-shadow:0 8px 32px var(--accent-glow);transform:translateY(-2px);}
.btn-primary:active{transform:translateY(0) scale(.97);}

footer{text-align:center;padding:2rem;color:var(--dim);font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.1em;border-top:1px solid var(--border);position:relative;z-index:1;}
.fade-el{animation:fadeUp .5s ease both;}
.enn-card{animation:revealIn .4s ease both;}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<nav>
  <a href="nero-landing.html" class="nav-logo">NERO</a>
  <div class="lang-switcher">
    <button class="lang-btn" data-lang="ar" onclick="setLang('ar')">AR</button>
    <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="theme-toggle" onclick="toggleTheme()" title="Theme"><span class="swatch"></span></button>
  </div>
</nav>

<main>
  <a href="nero-landing.html#types" class="back-link" id="backLink">‹ <span id="backLinkText">رجوع لكل الشخصيات</span></a>

  <div class="type-strip" id="typeStrip"></div>

  <section class="type-hero fade-el" id="typeHeroEl">
    <img id="heroPortrait" class="type-hero-portrait" src="" alt="">
    <div class="gender-toggle" id="genderToggle">
      <button class="gender-toggle-btn active" data-g="m" onclick="selectGender('m')">♂</button>
      <button class="gender-toggle-btn" data-g="f" onclick="selectGender('f')">♀</button>
    </div>
    <div class="type-hero-badge" id="heroBadge">تحليل الشخصية</div>
    <div class="type-hero-code" id="heroCode">INTJ</div>
    <div class="type-hero-name" id="heroName">المهندس المعماري</div>
    <div class="type-hero-stack" id="heroStack">Ni · Te · Fi · Se</div>
    <p class="type-hero-desc" id="heroDesc"></p>
  </section>

  <div class="two-col">
    <div class="info-box strengths fade-el" id="strengthsBox">
      <div class="info-box-title" id="strengthsTitle">نقاط القوة</div>
      <ul id="strengthsList"></ul>
    </div>
    <div class="info-box challenges fade-el" id="challengesBox">
      <div class="info-box-title" id="challengesTitle">تحديات تحتاج انتباه</div>
      <ul id="challengesList"></ul>
    </div>
  </div>

  <section class="fade-el">
    <h2 class="enn-section-title" id="famousTitle">شخصيات مشهورة بهاد النوع</h2>
    <p class="enn-note" id="famousNote"></p>
    <div class="famous-grid" id="famousList"></div>
  </section>

  <section>
    <h2 class="enn-section-title" id="ennTitle">الإنيغرامات <em>المحتملة</em></h2>
    <p class="enn-note" id="ennNote"></p>
    <div id="ennList"></div>
  </section>

  <div class="cta-box fade-el" id="ctaBox">
    <div class="cta-title" id="ctaTitle">أتريد معرفة نوعك الحقيقي؟</div>
    <a href="nero-test.html" class="btn-primary" id="ctaBtn">ابدأ الاختبار الآن ✦</a>
  </div>
</main>

<footer id="footerText">NERO © 2026</footer>

let currentLang = 'ar';
let currentType = 'INTJ';
let currentGender = 'm';

function getParams() {
  const p = new URLSearchParams(window.location.search);
  const type = (p.get('type') || 'INTJ').toUpperCase();
  const lang = p.get('lang') || 'ar';
  const gender = p.get('gender') === 'f' ? 'f' : 'm';
  return { type: ORDER.includes(type) ? type : 'INTJ', lang: ['ar','fr','en'].includes(lang) ? lang : 'ar', gender };
}

function updateUrl() {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('type', currentType);
    url.searchParams.set('lang', currentLang);
    url.searchParams.set('gender', currentGender);
    window.history.replaceState({}, '', url);
  } catch (e) {
    // Some preview/sandbox environments block history updates — safe to ignore.
  }
}

function selectGender(g) {
  currentGender = g;
  document.querySelectorAll('.gender-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.g === g));
  const portraitEl = document.getElementById('heroPortrait');
  if (portraitEl) portraitEl.src = PORTRAITS[`${currentType.toLowerCase()}-${currentGender}`] || '';
  updateUrl();
}

function renderStrip() {
  const strip = document.getElementById('typeStrip');
  strip.innerHTML = ORDER.map(code => `<button class="type-pill${code===currentType?' active':''}" onclick="selectType('${code}')">${code}</button>`).join('');
}

function selectType(code) {
  currentType = code;
  renderPage();
  updateUrl();
  window.scrollTo({top:0, behavior:'smooth'});
}

function setLang(l) {
  currentLang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  renderPage();
  updateUrl();
}

const NERO_THEMES = ['', 'theme-kiwi', 'theme-purple', 'theme-burgundy', 'theme-luxury'];
function toggleTheme() {
  const cur = NERO_THEMES.findIndex(t => t && document.body.classList.contains(t));
  const curIdx = cur === -1 ? 0 : cur;
  const nextIdx = (curIdx + 1) % NERO_THEMES.length;
  NERO_THEMES.forEach(t => t && document.body.classList.remove(t));
  if (NERO_THEMES[nextIdx]) document.body.classList.add(NERO_THEMES[nextIdx]);
  try { localStorage.setItem('nero_theme', NERO_THEMES[nextIdx]); } catch(e) {}
}
(function loadSavedTheme() {
  try {
    const saved = localStorage.getItem('nero_theme');
    if (saved && NERO_THEMES.includes(saved) && saved) document.body.classList.add(saved);
  } catch(e) {}
})();

function renderPage() {
  const t = TYPES[currentLang][currentType];
  const ui = UI[currentLang];

  document.getElementById('backLinkText').textContent = ui.back;
  document.getElementById('heroBadge').textContent = ui.badge;
  document.getElementById('heroPortrait').src = PORTRAITS[`${currentType.toLowerCase()}-${currentGender}`] || '';
  document.getElementById('heroPortrait').alt = currentType;
  document.getElementById('heroCode').textContent = currentType;
  document.getElementById('heroName').textContent = t.name;
  document.getElementById('heroStack').textContent = STACK[currentType];
  document.getElementById('heroDesc').textContent = t.desc;

  document.getElementById('strengthsTitle').textContent = ui.strengths;
  document.getElementById('strengthsList').innerHTML = t.strengths.map(s => `<li>${s}</li>`).join('');
  document.getElementById('challengesTitle').textContent = ui.challenges;
  document.getElementById('challengesList').innerHTML = t.challenges.map(c => `<li>${c}</li>`).join('');

  document.getElementById('famousTitle').textContent = ui.famousTitle;
  document.getElementById('famousNote').textContent = ui.famousNote;
  const famous = FAMOUS_PEOPLE[currentLang][currentType] || [];
  document.getElementById('famousList').innerHTML = famous.map(p => `
    <div class="famous-card">
      <div class="famous-name">${p.name}</div>
      <div class="famous-role">${p.role}</div>
    </div>`).join('');

  document.getElementById('ennTitle').innerHTML = ui.ennTitle;
  document.getElementById('ennNote').textContent = ui.ennNote;
  const ranks = ENN_RANK[currentType];
  document.getElementById('ennList').innerHTML = ranks.map((num, i) => {
    const info = ENNEA_9[currentLang][num];
    const isTop = i === 0;
    const isRare = i >= 5;
    let wingsHtml = '';
    if (!isRare) {
      const wings = WINGS[num].map(w => {
        const wInfo = ENNEA_9[currentLang][w];
        return `<span class="wing-chip"><b>${num}w${w}</b> · ${wInfo.name}</span>`;
      }).join('');
      wingsHtml = `<div class="enn-wings">${wings}</div>`;
    }
    return `
      <div class="enn-card${isTop ? ' top-match' : ''}${isRare ? ' rare-match' : ''}">
        <div class="enn-card-code">${num}</div>
        <div class="enn-card-body">
          <div class="enn-card-name">${info.name}${isTop ? `<span class="enn-card-tag">${ui.topMatch}</span>` : ''}${isRare ? `<span class="enn-card-tag rare">${ui.rare}</span>` : ''}</div>
          <div class="enn-card-desc">${info.desc}</div>
          ${wingsHtml}
        </div>
      </div>`;
  }).join('');

  document.getElementById('ctaTitle').textContent = ui.ctaTitle;
  document.getElementById('ctaBtn').textContent = ui.ctaBtn;

  renderStrip();

  // retrigger fade animations on update
  document.querySelectorAll('.fade-el').forEach(el => {
    el.classList.remove('fade-el');
    void el.offsetWidth;
    el.classList.add('fade-el');
  });
}

// ═══ ANIMATED BG (same style as landing/test) ═══
(function(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const rgb = '200,162,74';

  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }

  function init(){
    particles = [];
    const n = Math.floor((W * H) / 12000);
    for(let i = 0; i < n; i++) particles.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.4+0.3,
      vx: (Math.random()-.5)*.3, vy: (Math.random()-.5)*.3,
      op: Math.random()*.4+.06
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = `rgba(${rgb},.03)`;
    ctx.lineWidth = 1;
    for(let x=0;x<W;x+=56){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0;y<H;y+=56){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(${rgb},${p.op})`; ctx.fill();
    });
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<100){
          ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle=`rgba(${rgb},${.05*(1-d/100)})`; ctx.lineWidth=.5; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  resize(); init(); draw();
  window.addEventListener('resize', ()=>{ resize(); init(); });
})();
</script>
